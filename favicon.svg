<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0e0e0f"/>

  <!-- Lavender flower spike -->
  <g transform="translate(50, 50)">
    <!-- Stem -->
    <path d="M0 40 L0 5" stroke="#6b8e6b" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Leaf -->
    <path d="M0 28 Q-12 24 -15 18 Q-5 22 0 28" fill="#7ba37b"/>

    <!-- Flower buds (from top to bottom) -->
    <ellipse cx="0" cy="-25" rx="8" ry="10" fill="#a987c5"/>
    <ellipse cx="0" cy="-12" rx="10" ry="12" fill="#9676b2"/>
    <ellipse cx="0" cy="3" rx="11" ry="13" fill="#8b6aa7"/>
    <ellipse cx="0" cy="16" rx="9" ry="11" fill="#7d5c99"/>

    <!-- Flower dots -->
    <circle cx="-5" cy="-20" r="3" fill="#b99acc" opacity="0.8"/>
    <circle cx="5" cy="-20" r="3" fill="#b99acc" opacity="0.8"/>
    <circle cx="-6" cy="-8" r="3.5" fill="#b99acc" opacity="0.8"/>
    <circle cx="6" cy="-8" r="3.5" fill="#b99acc" opacity="0.8"/>
    <circle cx="-7" cy="5" r="4" fill="#b99acc" opacity="0.8"/>
    <circle cx="7" cy="5" r="4" fill="#b99acc" opacity="0.8"/>
  </g>
</svg>
